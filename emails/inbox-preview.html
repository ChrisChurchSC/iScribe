<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inbox preview — iScribe</title>
  <style>
    :root { --ink:#1d1d1f; --muted:#86868b; --line:#e7e7ea; --blue:#0033D8; }
    * { box-sizing: border-box; }
    body {
      margin:0; background:#d7dbe2;
      font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;
      padding:40px 16px;
      display:flex; justify-content:center;
    }
    .window {
      width:100%; max-width:760px;
      background:#fff; border-radius:14px; overflow:hidden;
      box-shadow:0 30px 80px rgba(20,24,40,0.28);
    }
    /* toolbar */
    .toolbar {
      display:flex; align-items:center; gap:10px;
      height:52px; padding:0 18px;
      background:#f6f6f7; border-bottom:1px solid var(--line);
    }
    .dots { display:flex; gap:8px; margin-right:8px; }
    .dots span { width:12px; height:12px; border-radius:50%; }
    .r{background:#ff5f57}.y{background:#febc2e}.g{background:#28c840}
    .tbtn {
      width:30px; height:30px; border-radius:7px;
      display:flex; align-items:center; justify-content:center;
      color:#8a8a8e;
    }
    .tbtn svg { width:18px; height:18px; }
    .tspace { flex:1; }
    /* message header */
    .head { padding:22px 28px 18px; }
    .subject { font-size:22px; font-weight:700; color:var(--ink); letter-spacing:-0.01em; margin:0 0 16px; }
    .senderRow { display:flex; align-items:center; gap:13px; }
    .avatar {
      width:42px; height:42px; border-radius:50%;
      background:var(--blue); color:#fff;
      display:flex; align-items:center; justify-content:center;
      font-weight:700; font-size:16px; letter-spacing:-0.02em; flex-shrink:0;
    }
    .sinfo { flex:1; min-width:0; }
    .sline1 { display:flex; align-items:baseline; gap:8px; }
    .sname { font-size:15px; font-weight:700; color:var(--ink); }
    .saddr { font-size:13px; color:var(--muted); }
    .sline2 { font-size:13px; color:var(--muted); margin-top:2px; }
    .meta { display:flex; align-items:center; gap:14px; color:var(--muted); flex-shrink:0; }
    .time { font-size:13px; white-space:nowrap; }
    .star svg { width:18px; height:18px; }
    /* body */
    .body { border-top:1px solid var(--line); background:#EDF0F4; }
    iframe { width:100%; height:1500px; border:0; display:block; }
  </style>
</head>
<body>
  <div class="window">
    <div class="toolbar">
      <span class="dots"><span class="r"></span><span class="y"></span><span class="g"></span></span>
      <div class="tbtn" title="Archive"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8M10 12h4"/></svg></div>
      <div class="tbtn" title="Trash"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M8 6V4h8v2M6 6v14a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V6"/></svg></div>
      <div class="tbtn" title="Reply"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 17L4 12l5-5M4 12h11a5 5 0 0 1 5 5v1"/></svg></div>
      <div class="tbtn" title="Forward"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 17l5-5-5-5M20 12H9a5 5 0 0 0-5 5v1"/></svg></div>
      <span class="tspace"></span>
      <div class="tbtn" title="Flag"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg></div>
    </div>

    <div class="head">
      <h1 class="subject">Your notes now code themselves</h1>
      <div class="senderRow">
        <div class="avatar">iS</div>
        <div class="sinfo">
          <div class="sline1"><span class="sname">iScribe Health</span><span class="saddr">&lt;product@iscribe.health&gt;</span></div>
          <div class="sline2">to me</div>
        </div>
        <div class="meta">
          <span class="time">Today, 9:41 AM</span>
          <span class="star"><svg viewBox="0 0 24 24" fill="none" stroke="#c8c8cd" stroke-width="1.8"><path d="M12 3l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 18.8 6.2 21.9l1.1-6.5L2.6 10.8l6.5-.9L12 3z"/></svg></span>
        </div>
      </div>
    </div>

    <div class="body">
      <iframe src="new-feature.html" title="iScribe feature email"></iframe>
    </div>
  </div>
</body>
</html>
